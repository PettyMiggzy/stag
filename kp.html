<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>KP</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:system-ui,sans-serif;
         background:#0a140d; color:#eafff0; }
  .card { width:min(92vw,420px); background:#0f1c13; border:1px solid #1c3a24; border-radius:18px;
          padding:26px; box-shadow:0 12px 40px #0008; text-align:center; }
  h1 { margin:0 0 4px; font-size:22px; letter-spacing:.5px; }
  .sub { color:#7fd39a; font-size:13px; margin-bottom:18px; }
  img { width:100%; border-radius:12px; margin-bottom:16px; border:1px solid #1c3a24; }
  input { width:70px; padding:10px; border-radius:10px; border:1px solid #2a4d32; background:#0a140d;
          color:#eafff0; font-size:16px; text-align:center; }
  button { width:100%; margin-top:14px; padding:14px; border:0; border-radius:12px; cursor:pointer;
           background:#2fbd57; color:#04120a; font-weight:700; font-size:16px; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; justify-content:center; }
  .msg { margin-top:14px; font-size:13px; color:#9fe6b6; min-height:18px; word-break:break-all; }
  a { color:#5fe08a; }
</style>
</head>
<body>
  <div class="card">
    <h1>👑 King Petty</h1>
    <div class="sub">private mint · 1 of 200</div>
    <img src="https://gateway.pinata.cloud/ipfs/bafybeieqdf5tbgpihqar7ni6ehdsuquehv4cx5ewyrijyk7xb5yryzvixa" alt="King Petty" onerror="this.style.display='none'" />
    <div class="row">
      <label>Qty <input id="qty" type="number" min="1" max="200" value="1" /></label>
    </div>
    <button id="go">Connect &amp; Mint</button>
    <div class="msg" id="msg"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script>
  // ── fill this in after you run the deploy script ──
  const CONTRACT = "0xE9cE3119dAa292b4fC3503E1196aBC8adBdfffc9";
  const RHC = { chainId: "0x1237", chainName: "Robinhood Chain",
    nativeCurrency: { name:"ETH", symbol:"ETH", decimals:18 },
    rpcUrls:["https://rpc.mainnet.chain.robinhood.com"],
    blockExplorerUrls:["https://robinhoodchain.blockscout.com"] };
  const ABI = [
    "function ownerMint(address to, uint256 qty)",
    "function totalMinted() view returns (uint256)",
    "function owner() view returns (address)"
  ];
  const $ = (id) => document.getElementById(id);
  const say = (t) => $("msg").innerHTML = t;

  $("go").onclick = async () => {
    try {
      if (!window.ethereum) return say("Open in a wallet browser (MetaMask/Rabby).");
      if (!CONTRACT.startsWith("0x") || CONTRACT.length !== 42) return say("Set the contract address in kp.html first.");
      $("go").disabled = true; say("Connecting…");
      await window.ethereum.request({ method: "eth_requestAccounts" });
      try { await window.ethereum.request({ method:"wallet_switchEthereumChain", params:[{chainId:RHC.chainId}] }); }
      catch { await window.ethereum.request({ method:"wallet_addEthereumChain", params:[RHC] }); }
      const provider = new ethers.BrowserProvider(window.ethereum);
      const signer = await provider.getSigner();
      const me = (await signer.getAddress());
      const c = new ethers.Contract(CONTRACT, ABI, signer);
      const owner = await c.owner();
      if (owner.toLowerCase() !== me.toLowerCase()) { say("This wallet isn't the owner — free mint is owner-only."); $("go").disabled=false; return; }
      const qty = Math.max(1, Math.min(200, parseInt($("qty").value || "1", 10)));
      say("Minting " + qty + "… confirm in wallet.");
      const tx = await c.ownerMint(me, qty);
      say("Sent — waiting…");
      await tx.wait();
      const total = await c.totalMinted();
      say("✅ Minted " + qty + " to you. Total " + total + "/200. Send them from your wallet.");
    } catch (e) { say("⚠️ " + (e?.shortMessage || e?.message || e)); }
    $("go").disabled = false;
  };
</script>
</body>
</html>
