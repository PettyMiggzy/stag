<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/icon.webp"><title>Your quote</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/pub.css"></head><body><div class="wrap" id="root"><p class="mute">Loading…</p></div>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tok=location.pathname.split('/').pop(),root=document.getElementById('root');
const ph=p=>String(p||'').length===10?'('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6):p||'';
async function load(){const r=await fetch('/api/public/q/'+encodeURIComponent(tok));if(!r.ok){root.innerHTML='<div class="card">This quote link is not valid. Please contact the business that sent it.</div>';return}
 const d=await r.json(),q=d.quote,b=d.business;document.title='Quote '+q.label+' · '+b.name;document.documentElement.style.setProperty('--accent',b.brand_color||'#39ff14');
 const addr=d.property?[d.property.address,[d.property.city,d.property.state,d.property.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '):'';
 root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b><span class="mute small">'+(b.phone?'<a href="tel:'+esc(b.phone)+'" style="color:inherit">'+esc(ph(b.phone))+'</a>':'')+'</span></div>'
 +'<div class="row"><h1 style="font-size:2.6rem">Quote '+esc(q.label)+'</h1>'+(q.status==='approved'?'<span class="chip">Approved</span>':q.status==='declined'?'<span class="chip bad">Declined</span>':'')+'</div>'
 +'<p class="mute">Prepared for '+esc(d.customer)+(addr?' · '+esc(addr):'')+'</p>'
 +'<div class="card">'+q.items.map(i=>'<div class="line"><div><b>'+esc(i.name)+'</b>'+(i.description?'<div class="mute small">'+esc(i.description)+'</div>':'')+'<div class="mute small">'+esc(i.qty)+' × '+money(i.price)+'</div></div><b>'+money(i.qty*i.price)+'</b></div>').join('')
 +'<div class="tot"><div class="mute"><span>Subtotal</span><span>'+money(q.subtotal)+'</span></div>'+(q.discount?'<div class="mute"><span>Discount ('+esc(Number(q.discount_pct))+'%)</span><span>−'+money(q.discount)+'</span></div>':'')+(q.tax?'<div class="mute"><span>Tax ('+esc(Number(q.tax_pct))+'%)</span><span>'+money(q.tax)+'</span></div>':'')+'<div class="big"><span>Total</span><span>'+money(q.total)+'</span></div>'+(Number(q.deposit)>0?'<div class="mute small"><span>Deposit requested</span><span>'+money(q.deposit)+'</span></div>':'')+'</div></div>'
 +(q.message?'<div class="card"><p style="margin:0;white-space:pre-wrap">'+esc(q.message)+'</p></div>':'');
 if(q.status==='sent'){root.insertAdjacentHTML('beforeend','<form class="card" id="f"><h3 style="margin-bottom:10px">Approve this quote</h3><label class="field"><span>Type your full name to approve</span><input name="name" autocomplete="name" required></label><label class="field"><span>Note for us (optional)</span><input name="note" maxlength="300"></label><p class="err" id="err" role="alert"></p><div class="row" style="justify-content:flex-start;gap:12px;flex-wrap:wrap"><button class="btn main" type="submit">Approve quote</button><button class="btn warn" type="button" id="dec">Decline</button></div></form>');
  const go=async decision=>{const name=document.querySelector('[name=name]').value.trim(),note=document.querySelector('[name=note]').value;document.getElementById('err').textContent='';const r=await fetch('/api/public/q/'+encodeURIComponent(tok)+'/decide',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision,name,note})});const j=await r.json();if(!r.ok){document.getElementById('err').textContent=j.error;return}load()};
  document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go('approve')});document.getElementById('dec').addEventListener('click',()=>{if(confirm('Decline this quote?'))go('decline')})}
 else if(q.status==='approved'){root.insertAdjacentHTML('beforeend','<div class="card ok"><b>Thank you, '+esc(q.signed_name||d.customer)+'!</b><p class="mute" style="margin:6px 0 0">Your approval was received. '+esc(b.name)+' will be in touch to schedule the work.</p></div>')}
 root.insertAdjacentHTML('beforeend','<p class="foot">Powered by <a href="/">STAGR</a></p>')}
load();
</script></body></html>
