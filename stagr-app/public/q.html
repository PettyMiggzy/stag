<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><title>Your quote</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/pub.css"></head><body><div class="wrap" id="root"><p class="mute">Loading…</p></div>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const tok=location.pathname.split('/').pop(),root=document.getElementById('root');
const ph=p=>String(p||'').length===10?'('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6):p||'';
let data=null,sel=new Set();
const calc=()=>{const d=data,it=d.quote.items;const sub=it.reduce((a,i,x)=>a+(i.kind==='text'||(i.optional&&!sel.has(x))?0:i.qty*i.price),0);const disc=Math.round(sub*(d.quote.discount_pct||0))/100;const tax=Math.round((sub-disc)*(d.quote.tax_pct||0))/100;const total=Math.round((sub-disc+tax)*100)/100;const pct=d.quote.deposit_pct||0;const dep=pct>0?Math.round(total*pct)/100:Number(d.quote.deposit)||0;return{sub:Math.round(sub*100)/100,disc,tax,total,dep}};
function totalsHtml(){const t=calc(),q=data.quote;return '<div class="tot"><div class="mute"><span>Subtotal</span><span>'+money(t.sub)+'</span></div>'+(t.disc?'<div class="mute"><span>Discount ('+esc(Number(q.discount_pct))+'%)</span><span>−'+money(t.disc)+'</span></div>':'')+(t.tax?'<div class="mute"><span>Tax ('+esc(Number(q.tax_pct))+'%)</span><span>'+money(t.tax)+'</span></div>':'')+'<div class="big"><span>Total</span><span>'+money(t.total)+'</span></div>'+(t.dep>0?'<div class="mute small"><span>Deposit required to begin</span><span>'+money(t.dep)+'</span></div>':'')+'</div>'}
async function load(){const r=await fetch('/api/public/q/'+encodeURIComponent(tok));if(!r.ok){root.innerHTML='<div class="card">This quote link is not valid. Please contact the business that sent it.</div>';return}
 const d=data=await r.json(),q=d.quote,b=d.business,open=q.status==='sent';document.title='Quote '+q.label+' · '+b.name;document.documentElement.style.setProperty('--accent',b.brand_color||'#39ff14');
 if(open&&!sel.size)q.items.forEach((i,x)=>{if(i.optional&&i.selected)sel.add(x)});
 const showSel=x=>q.items[x].optional&&(open?sel.has(x):q.items[x].selected);
 const addr=d.property?[d.property.address,[d.property.city,d.property.state,d.property.zip].filter(Boolean).join(' ')].filter(Boolean).join(', '):'';
 const lines=q.items.map((i,x)=>{if(i.kind==='text')return '<div class="line" style="display:block">'+(i.name?'<b>'+esc(i.name)+'</b>':'')+'<div class="mute" style="white-space:pre-wrap">'+esc(i.description)+'</div></div>';
  const off=i.optional&&!showSel(x);
  return '<div class="line" style="align-items:flex-start;'+(off?'opacity:.55':'')+'">'+(i.optional&&open?'<input type="checkbox" data-opt="'+x+'" '+(sel.has(x)?'checked':'')+' aria-label="Include '+esc(i.name)+'" style="margin-top:4px;flex:none">':'')+'<div style="flex:1;min-width:0"><b>'+esc(i.name)+'</b>'+(i.optional?' <span class="chip">'+(open?'optional':(showSel(x)?'optional · included':'not included'))+'</span>':'')+(i.description?'<div class="mute small" style="white-space:pre-wrap">'+esc(i.description)+'</div>':'')+'<div class="mute small">'+esc(i.qty)+' × '+money(i.price)+'</div></div>'+(i.image?'<img alt="" src="'+esc(i.image)+'" style="width:84px;height:60px;object-fit:cover;border-radius:8px;flex:none">':'')+'<b style="flex:none">'+money(i.qty*i.price)+'</b></div>'}).join('');
 root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b><span class="mute small">'+(b.phone?'<a href="tel:'+esc(b.phone)+'" style="color:inherit">'+esc(ph(b.phone))+'</a>':'')+'</span></div>'
 +'<div class="row"><h1 style="font-size:2.6rem">'+esc(q.title||'Quote '+q.label)+'</h1>'+(q.status==='approved'?'<span class="chip">Approved</span>':q.status==='declined'?'<span class="chip bad">Declined</span>':'')+'</div>'
 +'<p class="mute">Quote '+esc(q.label)+' for '+esc(d.customer)+(addr?' · '+esc(addr):'')+'</p><div class="card" id="qcard">'+lines+'<div id="tots">'+totalsHtml()+'</div></div>'
 +(q.message?'<div class="card"><p style="margin:0;white-space:pre-wrap">'+esc(q.message)+'</p></div>':'');
 const wire=()=>{document.querySelectorAll('[data-opt]').forEach(c=>c.addEventListener('change',()=>{const x=Number(c.dataset.opt);c.checked?sel.add(x):sel.delete(x);document.getElementById('tots').innerHTML=totalsHtml();c.closest('.line').style.opacity=c.checked?1:.55;const t=calc();const dn=document.getElementById('depn');if(dn)dn.textContent=t.dep>0?'A deposit of '+money(t.dep)+' is required to begin. '+esc(b.name)+' will contact you with payment instructions.':''}))};wire();
 if(open){const t0=calc();root.insertAdjacentHTML('beforeend','<form class="card" id="f"><h3 style="margin-bottom:10px">Approve this quote</h3><p class="mute small" id="depn" style="margin:0 0 10px">'+(t0.dep>0?'A deposit of '+money(t0.dep)+' is required to begin. '+esc(b.name)+' will contact you with payment instructions.':'')+'</p><label class="field"><span>Type your full name to approve</span><input name="name" autocomplete="name" required></label><label class="field"><span>Note for us (optional)</span><input name="note" maxlength="300"></label><p class="err" id="err" role="alert"></p><div class="row" style="justify-content:flex-start;gap:12px;flex-wrap:wrap"><button class="btn main" type="submit">Approve quote</button><button class="btn warn" type="button" id="dec">Decline</button></div></form>');
  const go=async decision=>{const name=document.querySelector('[name=name]').value.trim(),note=document.querySelector('[name=note]').value;document.getElementById('err').textContent='';const r=await fetch('/api/public/q/'+encodeURIComponent(tok)+'/decide',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({decision,name,note,selected:[...sel]})});const j=await r.json();if(!r.ok){document.getElementById('err').textContent=j.error;return}sel=new Set();load()};
  document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();go('approve')});document.getElementById('dec').addEventListener('click',()=>{if(confirm('Decline this quote?'))go('decline')})}
 else if(q.status==='approved'){root.insertAdjacentHTML('beforeend','<div class="card ok"><b>Thank you, '+esc(q.signed_name||d.customer)+'!</b><p class="mute" style="margin:6px 0 0">Your approval was received.'+(q.deposit_due>0&&!q.deposit_paid?' A deposit of '+money(q.deposit_due)+' is required to begin; '+esc(b.name)+' will contact you with payment instructions.':q.deposit_paid?' Your deposit has been received.':'')+' '+esc(b.name)+' will be in touch to schedule the work.</p></div>')}
 root.insertAdjacentHTML('beforeend','<p class="foot">Powered by <a href="/">STAGR</a></p>')}
load();
</script></body></html>
