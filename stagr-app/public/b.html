<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/icon.webp"><title>Request service</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/pub.css"></head><body><div class="wrap" id="root"><p class="mute">Loading…</p></div>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=location.pathname.split('/').pop(),root=document.getElementById('root'),ph=p=>String(p||'').length===10?'('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6):p||'';
function shrink(file,max=1100,q=.72){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('That file is not a photo'));img.src=u})}
const r=await fetch('/api/public/b/'+encodeURIComponent(slug));
if(!r.ok){root.innerHTML='<div class="card">This booking page is not available. Please contact the business directly.</div>'}else{
 const d=await r.json(),b=d.business;document.title='Request service · '+b.name;document.documentElement.style.setProperty('--accent',b.brand_color||'#39ff14');let photos=[];
 root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b><span class="mute small">'+(b.phone?'<a href="tel:'+esc(b.phone)+'" style="color:inherit">'+esc(ph(b.phone))+'</a>':'')+'</span></div><h1 style="font-size:2.6rem">Request service</h1><p class="mute">'+esc(b.intro||'Tell us what you need and we will get back to you quickly.')+'</p>'
 +'<form class="card" id="f" novalidate><div class="g2"><label class="field"><span>Your name</span><input name="name" required autocomplete="name"></label><label class="field"><span>Phone</span><input name="phone" inputmode="tel" autocomplete="tel"></label></div>'
 +'<label class="field"><span>Email</span><input name="email" type="email" autocomplete="email"></label>'
 +'<label class="field"><span>What do you need?</span><input name="service" list="svc" placeholder="Choose or type"><datalist id="svc">'+d.services.map(s=>'<option value="'+esc(s.name)+'">').join('')+'</datalist></label>'
 +'<label class="field"><span>Where is the work?</span><input name="address" autocomplete="street-address" placeholder="Street address"></label>'
 +'<label class="field"><span>Details</span><textarea name="message" maxlength="1500"></textarea></label>'
 +'<div class="field"><span style="font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)">Photos help us quote faster (optional)</span><div class="ph" id="ph"></div><label class="btn" style="margin-top:8px;width:fit-content">+ Add photos<input type="file" accept="image/*" multiple id="pf" hidden></label></div>'
 +'<label style="display:flex;gap:10px;align-items:flex-start;margin:6px 0 12px" class="small mute"><input type="checkbox" name="sms_ok"><span>Yes, text me about this request. Message and data rates may apply. Reply STOP to opt out.</span></label>'
 +'<p class="err" id="err" role="alert"></p><button class="btn main" type="submit" style="width:100%">Send my request</button></form><p class="foot">Powered by <a href="/">STAGR</a></p>';
 document.getElementById('pf').addEventListener('change',async e=>{for(const f of [...e.target.files].slice(0,4-photos.length)){try{photos.push(await shrink(f))}catch(err){document.getElementById('err').textContent=err.message}}document.getElementById('ph').innerHTML=photos.map(p=>'<img alt="Your photo" src="'+p+'">').join('')});
 document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),btn=e.target.querySelector('button[type=submit]');btn.disabled=true;document.getElementById('err').textContent='';
  const rr=await fetch('/api/public/b/'+encodeURIComponent(slug)+'/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...f,sms_ok:!!f.sms_ok,photos})});const j=await rr.json();
  if(!rr.ok){document.getElementById('err').textContent=j.error;btn.disabled=false;return}
  root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b></div><div class="card ok"><h2 style="font-size:2rem;margin-bottom:8px">Thank you!</h2><p style="margin:0">We got your request and will contact you soon.'+(b.phone?' Need us sooner? Call <a href="tel:'+esc(b.phone)+'" style="color:var(--accent)">'+esc(ph(b.phone))+'</a>.':'')+'</p></div>'})}
</script></body></html>
