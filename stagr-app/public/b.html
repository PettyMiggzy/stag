<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="/icon.webp"><title>Request service</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/pub.css"></head><body><div class="wrap" id="root"><p class="mute">Loading…</p></div>
<script type="module">
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=location.pathname.split('/').pop(),root=document.getElementById('root'),ph=p=>String(p||'').length===10?'('+p.slice(0,3)+') '+p.slice(3,6)+'-'+p.slice(6):p||'';
function shrink(file,max=1100,q=.72){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};img.onerror=()=>rej(new Error('That file is not a photo'));img.src=u})}
const r=await fetch('/api/public/b/'+encodeURIComponent(slug));
if(!r.ok){root.innerHTML='<div class="card">This booking page is not available. Please contact the business directly.</div>'}else{
 const d=await r.json(),b=d.business;document.title='Request service · '+b.name;document.documentElement.style.setProperty('--accent',b.brand_color||'#39ff14');let photos=[];
 root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b><span class="mute small">'+(b.phone?'<a href="tel:'+esc(b.phone)+'" style="color:inherit">'+esc(ph(b.phone))+'</a>':'')+'</span></div><h1 style="font-size:2.6rem">Request service</h1><p class="mute">'+esc(b.intro||'Tell us what you need and we will get back to you quickly.')+'</p>'
 +'<form class="card" id="f" novalidate><h3 style="margin-bottom:10px">Contact details</h3><div class="g2"><label class="field"><span>First name</span><input name="first" required autocomplete="given-name"></label><label class="field"><span>Last name</span><input name="last" autocomplete="family-name"></label></div>'
 +'<label class="field"><span>Company name</span><input name="company" autocomplete="organization"></label>'
 +'<label class="field"><span>Email</span><input name="email" type="email" autocomplete="email"></label>'
 +'<label class="chk"><input type="checkbox" name="email_ok"><span>I agree to receive marketing emails and promotions from '+esc(b.name)+'. You can unsubscribe at any time. Even if you do not check this box, you will still receive important messages like reminders and updates.</span></label>'
 +'<label class="field"><span>Phone</span><input name="phone" inputmode="tel" autocomplete="tel" placeholder="(555) 555-5555"></label>'
 +'<label class="chk"><input type="checkbox" name="sms_ok"><span>I agree to receive marketing text messages (SMS), such as special offers and promotions, from '+esc(b.name)+'. Message and data rates may apply. Frequency varies. Reply STOP to opt out. Even if you do not check this box, you will still receive important messages like reminders and updates.</span></label>'
 +'<h3 style="margin:16px 0 10px">Address</h3><label class="field"><span>Street address</span><input name="street" autocomplete="address-line1"></label><label class="field"><span>Unit, apartment, suite (optional)</span><input name="unit" autocomplete="address-line2"></label>'
 +'<div class="g3"><label class="field"><span>City</span><input name="city" autocomplete="address-level2"></label><label class="field"><span>State</span><input name="state" maxlength="2" autocomplete="address-level1" placeholder="TX"></label><label class="field"><span>ZIP</span><input name="zip" autocomplete="postal-code" inputmode="numeric"></label></div>'
 +'<h3 style="margin:16px 0 10px">Service details</h3><label class="field"><span>What do you need? (choose or type)</span><input name="service" list="svc"><datalist id="svc">'+d.services.map(s=>'<option value="'+esc(s.name)+'">').join('')+'</datalist></label>'
 +'<label class="field"><span>Please provide as much information as you can <em style="color:var(--accent);font-style:normal">required</em></span><textarea name="message" required maxlength="1500"></textarea></label>'
 +'<h3 style="margin:16px 0 10px">Your availability</h3><div class="g2"><label class="field"><span>Which day would be best for an assessment of the work?</span><input type="date" name="d1"></label><label class="field"><span>What is another day that works for you?</span><input type="date" name="d2"></label></div>'
 +'<div class="field"><span>What are your preferred arrival times?</span><div class="arr"><label><input type="checkbox" name="arr" value="any"> Any time</label><label><input type="checkbox" name="arr" value="morning"> Morning</label><label><input type="checkbox" name="arr" value="afternoon"> Afternoon</label></div></div>'
 +'<div class="field"><span>Upload images · share images of the work to be done</span><div class="ph" id="ph"></div><label class="btn" style="margin-top:8px;width:fit-content">+ Add photos<input type="file" accept="image/*" multiple id="pf" hidden></label></div>'
 +'<p class="err" id="err" role="alert"></p><button class="btn main" type="submit" style="width:100%">Submit</button></form><p class="foot">Powered by <a href="/">STAGR</a></p>';
 document.getElementById('pf').addEventListener('change',async e=>{for(const f of [...e.target.files].slice(0,4-photos.length)){try{photos.push(await shrink(f))}catch(err){document.getElementById('err').textContent=err.message}}document.getElementById('ph').innerHTML=photos.map(p=>'<img alt="Your photo" src="'+p+'">').join('')});
 document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const form=e.target,f=Object.fromEntries(new FormData(form)),btn=form.querySelector('button[type=submit]');document.getElementById('err').textContent='';
  const name=[f.first,f.last].map(x=>(x||'').trim()).filter(Boolean).join(' ');if(!name){document.getElementById('err').textContent='Please enter your name';return}
  if(!(f.message||'').trim()){document.getElementById('err').textContent='Please tell us what you need';return}
  const address=[f.street,f.unit,[f.city,(f.state||'').toUpperCase(),f.zip].filter(Boolean).join(' ')].map(x=>(x||'').trim()).filter(Boolean).join(', ');
  btn.disabled=true;const rr=await fetch('/api/public/b/'+encodeURIComponent(slug)+'/request',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name,company:f.company,phone:f.phone,email:f.email,service:f.service,address,message:f.message,photos,sms_ok:!!f.sms_ok,email_ok:!!f.email_ok,availability:{dates:[f.d1,f.d2].filter(Boolean),arrival:[...form.querySelectorAll('[name=arr]:checked')].map(x=>x.value)}})});const j=await rr.json();
  if(!rr.ok){document.getElementById('err').textContent=j.error;btn.disabled=false;return}
  root.innerHTML='<div class="top"><b>'+esc(b.name)+'</b></div><div class="card ok" style="text-align:center;padding:30px 18px"><h2 style="font-size:2.2rem;margin-bottom:8px">Your request has been confirmed!</h2><p style="margin:0">We will follow up via email or text to confirm the request.'+(b.phone?' Need us sooner? Call <a href="tel:'+esc(b.phone)+'" style="color:var(--accent)">'+esc(ph(b.phone))+'</a>.':'')+'</p></div>'})}
</script></body></html>
