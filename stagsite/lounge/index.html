const videos=[];const vtex=[];const screenObjs=[];
function screen(x,y,z,ry,w,h,file){
  const v=document.createElement('video');v.muted=true;v.loop=true;v.playsInline=true;v.preload='auto';v.crossOrigin='anonymous';
  const src=document.createElement('source');
  const webm=v.canPlayType('video/webm; codecs="vp9"');
  src.src='./assets/screens/'+file+(webm?'.webm':'.mp4');v.appendChild(src);
  const tex=new THREE.VideoTexture(v);tex.colorSpace=THREE.SRGBColorSpace;
  // show the still art first; switch to the moving version only once the video is really playing (phones refuse to start video until you tap, which used to leave a big black rectangle)
  const poster=new THREE.TextureLoader().load('./assets/screens/'+file+'.jpg');poster.colorSpace=THREE.SRGBColorSpace;
  const mat=new THREE.MeshBasicMaterial({map:CAP?tex:poster,toneMapped:false});
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);
  v.addEventListener('playing',()=>{mat.map=tex;mat.needsUpdate=true;});
  v.addEventListener('pause',()=>{if(!CAP){mat.map=poster;mat.needsUpdate=true;}});
  const g=new THREE.Group();g.position.set(x,y,z);g.rotation.y=ry;scene.add(g);
  m.position.z=.06;g.add(m);
  const fr=new THREE.Mesh(new THREE.BoxGeometry(w+.22,h+.22,.08),M.gold);fr.position.z=-.02;g.add(fr);
  const bk=new THREE.Mesh(new THREE.BoxGeometry(w+.1,h+.1,.05),M.black);bk.position.z=-.005;g.add(bk);
  videos.push(v);vtex.push(tex);screenObjs.push({g,v});return v;
}
const SX=RW/2-.12;
screen(-SX,3.7,-9,Math.PI/2,3.8,3.8,'h1');
screen(-SX,3.7,-1.5,Math.PI/2,3.8,3.8,'h5');
screen(SX,3.7,-9,-Math.PI/2,3.8,3.8,'h2');
screen(SX,3.7,-1.5,-Math.PI/2,3.8,3.8,'h8');
screen(9.15,2.05,5.03,Math.PI,2.6,2.6,'h14');
screen(-9.15,2.05,5.03,Math.PI,2.6,2.6,'h11');
for(const sx of[-1,1])for(const dx of[-2.2,2.2])box(.05,2.8,.05,M.goldGlow,sx*9.15+dx,1.7,5.0);

/* ---------- beams & spot lights ---------- */
const beamMat=c=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,
  uniforms:{c:{value:new THREE.Color(c)},a:{value:.05}},
  vertexShader:'varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}',
  fragmentShader:'uniform vec3 c;uniform float a;varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){float f=abs(dot(normalize(vN),normalize(vV)));f=pow(f,1.6);float g=pow(vUv.y,1.3);gl_FragColor=vec4(c,a*f*g);}'});
const rigs=[];
function spot(x,z,color,tx,tz,intensity,shadow){
  const L=new THREE.SpotLight(color,intensity,22,.42,.75,1.4);L.position.set(x,RH-.3,z);L.target.position.set(tx,STAGE_Y+1,tz);
  if(shadow){L.castShadow=true;L.shadow.mapSize.set(1024,1024);L.shadow.bias=-.0004;L.shadow.radius=3;}
  scene.add(L,L.target);
  const len=RH-.3-STAGE_Y;const r=Math.tan(.42)*len*.9;
  const geo=new THREE.CylinderGeometry(.06,r,len,36,1,true);geo.translate(0,-len/2,0);
  const bm=new THREE.Mesh(geo,beamMat(color));bm.position.copy(L.position);scene.add(bm);
  const fix=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.3,16),M.black);fix.position.copy(L.position);scene.add(fix);

}
spot(-3.2,-1,0xff2d9a,0,-1.8,70,true);
spot(3.2,-1,0xffb347,0,-1.8,60,false);
spot(-2.2,-6.5,0x6c7bff,0,-3,40,false);
spot(2.2,-6.5,0xff2d9a,0,-3,40,false);
spot(0,2.6,0xfff1d6,0,-1.6,45,false);
const rim1=new THREE.PointLight(0xff2d9a,7,9,1.7);rim1.position.set(-2.4,2.2,-4.8);scene.add(rim1);
const rim2=new THREE.PointLight(0x58c8ff,5,9,1.7);rim2.position.set(2.4,2.2,-4.8);scene.add(rim2);
const hemi=new THREE.HemisphereLight(0x9a6ab0,0x2a1020,.8);scene.add(hemi);
for(const sx of[-1,1]){const f=new THREE.PointLight(0xffa860,30,14,1.5);f.position.set(sx*9.2,2.6,sx<0?-1.5:3);scene.add(f);}

/* ---------- dancer ---------- */
const loader=new GLTFLoader();
const load=u=>new Promise((res,rej)=>loader.load(u,res,undefined,rej));
const DANCE_PLAN=[['dance_allnight',15],['dance_loveyou',13],['dance_superlove',13],['dance_cherish',13],['dance_jazz',11],['dance_rhythmic',13]];
let dancer={mixer:null,actions:{},idx:-1,t:0,until:0,cur:null,root:null};

async function setupDancer(){
  const g=await load('./assets/dancerC.glb');
  const root=new THREE.Group();root.add(g.scene);scene.add(root);
  g.scene.traverse(o=>{if(o.isMesh||o.isSkinnedMesh){o.castShadow=true;o.receiveShadow=true;o.frustumCulled=false;if(o.material){o.material.envMapIntensity=.45;o.material.color.setScalar(.5);o.material.roughness=.75;o.material.metalness=0;if(o.material.map)o.material.map.anisotropy=8;}}});
  root.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(g.scene,true);const hgt=bb.max.y-bb.min.y;
  const sc=1.74/hgt;g.scene.scale.multiplyScalar(sc);
  root.updateMatrixWorld(true);
  const bb2=new THREE.Box3().setFromObject(g.scene,true);g.scene.position.y-=bb2.min.y;
  root.position.set(0,STAGE_Y+.045,-1.4);
  dancer.root=root;
  const mixer=new THREE.AnimationMixer(g.scene);dancer.mixer=mixer;
  const files=['idle','wave','walk','drink',...DANCE_PLAN.map(d=>d[0])];
  for(const f of files){
    try{
      const a=await load('./assets/anims/'+f+'.glb');const clip=a.animations[0];if(!clip)continue;
      // keep dancer in place: remove horizontal drift on the root bone
      const root0=a.scene.children[0];
      for(const tr of clip.tracks){
        if(tr.name.endsWith('.position')&&tr.name.indexOf('Hips')>=0){
          const v=tr.values;const x0=v[0],z0=v[2];for(let i=0;i<v.length;i+=3){v[i]-=x0;v[i+2]-=z0;}
        }
      }
      const act=mixer.clipAction(clip);act.setLoop(THREE.LoopRepeat,Infinity);dancer.actions[f]=act;
    }catch(e){console.warn('anim fail',f,e);}
  }
  next(0);
}
function next(now){
  dancer.idx=(dancer.idx+1)%DANCE_PLAN.length;
  const [name,dur]=DANCE_PLAN[dancer.idx];const act=dancer.actions[name];if(!act){dancer.until=now+1;return;}
  act.reset().setEffectiveWeight(1).play();
  if(dancer.cur&&dancer.cur!==act)dancer.cur.crossFadeTo(act,.9,false);
  dancer.cur=act;dancer.until=now+dur;
}

// everyone in the lounge sees the same dance at the same moment: the server's clock picks the clip and the point in it
function syncDance(sec){
  if(!dancer.mixer||!Object.keys(dancer.actions).length)return;
  const total=DANCE_PLAN.reduce((a,x)=>a+x[1],0);let t=((sec%total)+total)%total,k=0;
  while(t>=DANCE_PLAN[k][1]){t-=DANCE_PLAN[k][1];k++;}
  dancer.idx=k-1;next(tAbs);
  if(dancer.cur){const d=dancer.cur.getClip().duration;dancer.cur.time=t%d;}
  dancer.until=tAbs+(DANCE_PLAN[k][1]-t);
}
/* ---------- camera path ---------- */
const KEYS=[
  [0,[0,1.65,13.5],[0,2.4,-10]],
  [5,[0,1.7,8],[0,1.5,-3]],
  [9,[-2,2.0,7],[10,3.4,-1.5]],
  [13,[3.1,1.5,3.2],[0,1.25,-1.4]],
  [17,[-3.0,1.4,1.6],[0,1.25,-1.5]],
  [21,[-2.6,1.6,7.4],[-8.5,1.5,9.2]],
  [25,[-1.2,1.9,-3.5],[0,2.4,-12]],
  [28,[0,1.65,13.5],[0,2.4,-10]],
];
const TOTAL=28;
const sm=x=>x*x*(3-2*x);
function camAt(t){
  t=((t%TOTAL)+TOTAL)%TOTAL;
  let i=0;while(i<KEYS.length-2&&t>KEYS[i+1][0])i++;
  const a=KEYS[i],b=KEYS[i+1];const k=sm(Math.min(1,Math.max(0,(t-a[0])/(b[0]-a[0]))));
  const p=new THREE.Vector3(...a[1]).lerp(new THREE.Vector3(...b[1]),k);
  const l=new THREE.Vector3(...a[2]).lerp(new THREE.Vector3(...b[2]),k);
  return [p,l];
}

/* ---------- post ---------- */
const composer=new EffectComposer(renderer);
composer.setSize(W,H);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(CAP?W:W/2,CAP?H:H/2),.55,.55,.92);composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- loop ---------- */
// SAFE MODE: the plain renderer (no glow pass, no mirror floor). Some graphics drivers drop part of the fancy pipeline and leave a big black area; we watch for that and switch by ourselves, and there is a manual button too.
let SAFE=false;try{SAFE=localStorage.getItem('loungeSafe')==='1';}catch(e){}
function applySafe(){if(REFL)REFL.visible=!SAFE;floor.material.transparent=!SAFE&&!LOW;floor.material.opacity=SAFE||LOW?1:.9;floor.material.needsUpdate=true;}
function setSafe(on,remember){SAFE=!!on;applySafe();if(remember){try{localStorage.setItem('loungeSafe',on?'1':'0');}catch(e){}}console.warn('display mode:',on?'safe (plain render)':'full');}
let probeN=0,probeBad=0;
function probeFrame(){ // read a few pixels of the frame just drawn: a lit room never has a dead-black middle with bright edges
  if(SAFE||(++probeN%40))return;try{const gl=renderer.getContext(),w=gl.drawingBufferWidth,h=gl.drawingBufferHeight,px=new Uint8Array(4);
    const S=(fx,fy)=>{gl.readPixels(Math.floor(w*fx),Math.floor(h*fy),1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);return px[0]+px[1]+px[2];};
    let mid=0;for(const fx of[.3,.5,.7])for(const fy of[.3,.5,.7])mid+=S(fx,fy);const edge=Math.max(S(.03,.5),S(.97,.5),S(.03,.3),S(.97,.3));
    if(mid===0&&edge>40){if(++probeBad>=3){setSafe(true,false);}}else probeBad=0;}catch(e){}
}
let tAbs=0,vidT=0;const frustum=new THREE.Frustum(),pm=new THREE.Matrix4(),vp=new THREE.Vector3();
function culling(dt){
  vidT+=dt;if(vidT<.6)return;vidT=0;pm.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);frustum.setFromProjectionMatrix(pm);
  for(const s of screenObjs){s.g.getWorldPosition(vp);const vis=frustum.containsPoint(vp)||frustum.intersectsSphere(new THREE.Sphere(vp,2.4));if(vis&&s.v.paused)s.v.play().catch(()=>{});else if(!vis&&!s.v.paused)s.v.pause();}
}
// frame-rate governor: only if a device is really struggling, lower the pixel density a touch, never the scene
let gAcc=0,gN=0,gLow=0,gPr=renderer.getPixelRatio();const gMax=gPr;
function governor(dt){
  gAcc+=dt;gN++;if(gAcc<1)return;const fps=gN/gAcc;gAcc=0;gN=0;
  if(fps<24)gLow++;else if(fps>38)gLow=0;
  if(gLow>=3&&gPr>gMax*.6){gPr=Math.max(gMax*.6,gPr*.88);renderer.setPixelRatio(gPr);composer.setPixelRatio(gPr);renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);gLow=0;}
}
function stepWorld(dt){
  tAbs+=dt;
  if(dancer.mixer){dancer.mixer.update(dt);if(tAbs>=dancer.until)next(tAbs);}
  for(const r of rigs){
    const s=Math.sin(tAbs*.35+r.ph)*.55, c=Math.cos(tAbs*.29+r.ph)*.4;
    r.L.target.position.set(r.tx+s,STAGE_Y+1,r.tz+c);
    r.L.target.updateMatrixWorld();
    // aim beam mesh along light direction
    const dir=r.L.target.position.clone().sub(r.L.position).normalize();
    r.bm.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir);
  }
  signGlow.intensity=14+Math.sin(tAbs*1.1)*1.5;
}
function placeCam(t){const [p,l]=camAt(t);camera.position.copy(p);camera.lookAt(l);}

let userCtl=null,orbit=null;
function enableOrbit(){
  if(orbit)return;orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,1.4,-2);orbit.enableDamping=true;orbit.maxPolarAngle=Math.PI*.52;orbit.minDistance=1.2;orbit.maxDistance=24;
  const [,l]=camAt(tAbs);orbit.target.copy(l);orbit.update();userCtl=performance.now();
}
renderer.domElement.addEventListener('pointerdown',()=>{if(!CAP&&!window.__lounge.hooks.tick)enableOrbit();});

addEventListener('pointerdown',()=>{for(const v of videos)if(v.paused)v.play().catch(()=>{});},{passive:true});
function mergeStatic(){
  scene.updateMatrixWorld(true);const groups=new Map(),kill=[];
  scene.traverse(o=>{
    if(!o.isMesh||o.isSkinnedMesh||o.isInstancedMesh||o.userData.keep||!o.geometry||!o.geometry.index)return;
    const m=o.material;if(Array.isArray(m)||m.isShaderMaterial||m.isMeshBasicMaterial||m.transparent||m.isSpriteMaterial)return;
    const key=m.uuid+(o.castShadow?'c':'')+(o.receiveShadow?'r':'');
    let g=groups.get(key);if(!g){g={m,cast:o.castShadow,recv:o.receiveShadow,geos:[],src:[]};groups.set(key,g);}
    g.geos.push(o.geometry.clone().applyMatrix4(o.matrixWorld));g.src.push(o);
  });
  let before=0,after=0;
  for(const g of groups.values()){
    before+=g.src.length;let merged=null;try{merged=mergeGeometries(g.geos,false);}catch(e){}
    if(!merged){after+=g.src.length;continue;}
    const mesh=new THREE.Mesh(merged,g.m);mesh.castShadow=g.cast;mesh.receiveShadow=g.recv;scene.add(mesh);after++;
    for(const o of g.src)o.removeFromParent();for(const x of g.geos)x.dispose();
  }
  console.log('merged static meshes:',before,'->',after);
}
mergeStatic();
{const seen=new Set();scene.traverse(o=>{if(!o.isMesh||!o.material)return;for(const m of [].concat(o.material)){if(seen.has(m)||!m.isMeshStandardMaterial||m.userData.envSet)continue;seen.add(m);if(m.envMapIntensity===1)m.envMapIntensity=.12;}});floor.material.envMap=scene.environment;floor.material.envMapIntensity=.025;floor.material.roughness=.2;floor.material.emissive=new THREE.Color(0xa07c86);floor.material.emissiveMap=floor.material.map;floor.material.emissiveIntensity=1.5;floor.material.color.setScalar(2.6);floor.material.needsUpdate=true;}
window.__lounge={THREE,scene,camera,renderer,M,STAGE_Y,COLLIDERS,cardRoom,setSafe,isSafe:()=>SAFE,setSign:(o)=>window.__setSign&&window.__setSign(o),studio:studioState,syncDance,hooks:{tick:null,autoCam:()=>placeCam(tAbs)}};
async function boot(){
  await Promise.all([setupDancer(),loadStudioProps()]);
  for(const v of videos){try{await v.play();}catch(e){}}
  document.getElementById('load').style.opacity=0;setTimeout(()=>document.getElementById('load').remove(),900);
  applySafe();window.__videos=videos;window.__ready=true;
  if(!CAP){ import('./live.js').catch(e=>console.error('live layer failed',e));
    let last=performance.now();
    const loop=now=>{
      const dt=Math.min(.05,(now-last)/1000);last=now;stepWorld(dt);
      if(window.__lounge.hooks.tick)window.__lounge.hooks.tick(dt);else if(!orbit)placeCam(tAbs);else orbit.update();
      culling(dt);governor(dt);if(window.__archTick)window.__archTick(camera.position);if(SAFE)renderer.render(scene,camera);else composer.render();probeFrame();requestAnimationFrame(loop);
    };requestAnimationFrame(loop);
  }
}
// capture API: deterministic stepping
window.__cap={
  step(dt){stepWorld(dt);return true;}, // advance the world without drawing, used to resume an interrupted render
  async frame(dt,tCam){
    const t0=performance.now();
    stepWorld(dt);
    for(const v of videos){const d=v.duration||8;const want=tAbs%d;v.currentTime=want;}
    await new Promise(r=>setTimeout(r,0));
    await Promise.all(videos.map(v=>v.seeking?new Promise(r=>v.addEventListener('seeked',r,{once:true})):1));
    const t1=performance.now();
    for(const t of vtex)t.needsUpdate=true;placeCam(tCam);if(Q.has('cam')){const c=Q.get('cam').split(',').map(Number);camera.position.set(c[0],c[1],c[2]);camera.lookAt(c[3],c[4],c[5]);}composer.render();
    renderer.getContext().finish();
    return [Math.round(t1-t0),Math.round(performance.now()-t1)];
  }
};
addEventListener('resize',()=>{if(CAP)return;renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
boot().catch(e=>{console.error(e);window.__err=String(e);});
